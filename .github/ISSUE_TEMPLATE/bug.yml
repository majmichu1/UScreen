name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `uscreen doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Daemon log
      description: "`journalctl --user -u uscreen -n 200`, or run `RUST_LOG=uscreen=debug uscreen start` in a terminal"
      render: text
  - type: input
    id: versions
    attributes:
      label: UScreen version (host and app)
      placeholder: "1.1.0 / 1.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, desktop, GPU
      placeholder: "Bazzite 42, KDE Plasma 6 (Wayland), NVIDIA RTX 4060"
    validations:
      required: true
  - type: input
    id: tablet
    attributes:
      label: Tablet and Android version
      placeholder: "Galaxy Tab S9 Ultra, Android 14"
